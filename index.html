<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hamz Dar’s architecture portfolio is in progress.">
<meta name="theme-color" content="#e9edff">
<title>Hamz Dar — In progress</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9edff; color: #192451; }
  main {
    min-height: 100svh; padding: clamp(2rem, 6vh, 4rem) 1.25rem;
    display: grid; align-content: center; justify-items: center; text-align: center;
    background-image: linear-gradient(#27399c10 1px, transparent 1px),
      linear-gradient(90deg, #27399c10 1px, transparent 1px);
    background-size: 24px 24px;
  }
  h1 { font: 800 clamp(3.5rem, 12vw, 9rem)/.9 Arial, sans-serif; letter-spacing: -.085em; margin: 0; padding-right: .085em; }
  canvas { width: min(100%, 34rem); height: auto; display: block; margin-block: 1.1rem .65rem; }
  p { margin: 0; padding: .65em 1em; border: 1px solid; background: #fdfdfd; box-shadow: 3px 3px #192451; transform: rotate(-3deg); font: 700 1rem/1.2 ui-monospace, monospace; }
</style>
<script src="illustration.js" defer></script>
</head>
<body>
  <main>
    <h1>Hamz Dar</h1>
    <canvas width="1200" height="760" role="img" aria-label="A hard-hatted pigeon studies a blueprint of a building shaped like a giant slice of bread."></canvas>
    <p>In progress</p>
  </main>
</body>
</html>
