<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An architecture portfolio by Hamz Dar.">
  <meta name="color-scheme" content="dark light">
  <title>Hamz Dar — Architecture Portfolio</title>
  <link rel="stylesheet" href="portfolio.css">
  <script src="portfolio.js"></script>
</head>
<body>
  <canvas class="sketch-trail" aria-hidden="true"></canvas>
  <main class="portfolio">
    <header class="intro">
      <div class="topline">
        <p>Architecture portfolio</p>
        <fieldset class="theme-control" hidden>
          <legend class="sr-only">Color theme</legend>
          <label><input type="radio" name="theme" value="dark" checked><span>Dark</span></label>
          <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        </fieldset>
      </div>

    </header>

    <div class="name-row">
      <h1>Hamz Dar</h1>
      <a class="download" href="Hamz-Dar-Portfolio.pdf" download="Hamz Dar — Architecture Portfolio.pdf" aria-label="Download portfolio PDF">
        <span class="download-icon" aria-hidden="true"></span>
        <span class="download-label">Download portfolio</span>
        <span class="download-short-label" aria-hidden="true">Portfolio</span>
        <span class="file-type">PDF</span>
      </a>
    </div>

    <div class="gallery" aria-label="Selected projects">
      <article class="project project-thesis" id="project-murree">
        <a class="project-link" href="projects/murree.html" data-project-link="murree" aria-labelledby="thesis-title">
          <figure>
            <div class="project-image"><img src="assets/murree.webp" alt="A model of the former Murree Brewery ruins and a proposed public courtyard" width="1520" height="592" fetchpriority="high"></div>
            <figcaption id="thesis-title">(Alter)native approaches</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-hillpark">
        <a class="project-link" href="projects/hillpark.html" data-project-link="hillpark" aria-labelledby="hillpark-title">
          <figure>
            <div class="project-image"><img src="assets/hillpark.webp" alt="A low, glass-fronted café set into a wooded hillside" width="1245" height="767"></div>
            <figcaption id="hillpark-title">Café at Hillpark</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-murs">
        <a class="project-link" href="projects/murs.html" data-project-link="murs" aria-labelledby="murs-title">
          <figure>
            <div class="project-image"><img src="assets/murs.webp" alt="A path of stepping stones through a planted clearing" loading="lazy" decoding="async"></div>
            <figcaption id="murs-title">Murs à pêches</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-raum">
        <a class="project-link" href="projects/raum.html" data-project-link="raum" aria-labelledby="raum-title">
          <figure>
            <div class="project-image"><img src="assets/raum.webp" alt="A planted outdoor walkway beside a building with exposed steel trusses" loading="lazy" decoding="async"></div>
            <figcaption id="raum-title">Raum für Alltag</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-just-wallpaper">
        <a class="project-link" href="projects/just-wallpaper.html" data-project-link="just-wallpaper" aria-labelledby="wallpaper-title">
          <figure>
            <div class="project-image"><img src="assets/just-wallpaper.webp" alt="An architectural elevation of apartment façades with a glazed central bay" loading="lazy" decoding="async"></div>
            <figcaption id="wallpaper-title">Just Wallpaper</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-deine-gunst">
        <a class="project-link" href="projects/deine-gunst.html" data-project-link="deine-gunst" aria-labelledby="kunst-title">
          <figure>
            <div class="project-image"><img src="assets/deine-gunst.webp" alt="A physical model of a small pavilion framed by bare trees" loading="lazy" decoding="async"></div>
            <figcaption id="kunst-title">Deine Gunst der Kunst</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-studio-catalyst">
        <a class="project-link" href="projects/studio-catalyst.html" data-project-link="studio-catalyst" aria-labelledby="catalyst-title">
          <figure>
            <div class="project-image"><img src="assets/studio-catalyst.webp" alt="An architectural perspective of a layered urban building alongside a street" loading="lazy" decoding="async"></div>
            <figcaption id="catalyst-title">Studio Catalyst</figcaption>
          </figure>
        </a>
      </article>
      <article class="project" id="project-haus-der-photographie">
        <a class="project-link" href="projects/haus-der-photographie.html" data-project-link="haus-der-photographie" aria-labelledby="haus-title">
          <figure>
            <div class="project-image"><img src="assets/haus-der-photographie.webp" alt="A view of the historic brick exhibition halls at the Deichtorhallen" loading="lazy" decoding="async"></div>
            <figcaption id="haus-title">Haus der Photographie</figcaption>
          </figure>
        </a>
      </article>
    </div>
    <footer class="closing" id="contact">
      <figure class="portrait" tabindex="0">
        <img src="assets/hamz-dar-color.webp" alt="Portrait of Hamz Dar" width="1200" height="900" loading="lazy">
      </figure>
      <div class="closing-copy">
        <p class="thank-you" lang="de"><span>Danke fürs Vorbeischauen.</span></p>
        <div class="contact">
          <h2>Contact</h2>
          <address>
            <a href="mailto:hamz.dar@gmail.com">hamz.dar@gmail.com</a>
            <a href="tel:+4917636823632">+49 176 3682 3632</a>
          </address>
        </div>
      </div>
    </footer>
  </main>
</body>
</html>
